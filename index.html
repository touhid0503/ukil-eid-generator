<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <title>Ukil Eid Generator</title>
    <link rel="stylesheet" href="style.css">
</head>

<body>
    <div class="container">
        <h1>Eid Card Generator - Ukil</h1>
        <img src="assets/template.png" class="template-preview" alt="Template Preview">

        <div class="form">
            <label>Upload Your Image (Portrait preferred)</label>
            <input type="file" id="imageUpload" accept="image/*">

            <label>Your Designation</label>
            <input type="text" id="designation" placeholder="Ex: Tech Intern">

            <button type="button" id="nextBtn">Generate Card</button>
        </div>
    </div>
    <script src="script.js"></script>
</body>

</html>
